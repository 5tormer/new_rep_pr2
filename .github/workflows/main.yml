name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - development
      - release
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install sphinx
          pip install -r requirements.txt
          pip install pdoc

      - name: Run unit tests
        run: python -m pytest tests/test.py -v

      - name: Generate documentation
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          mkdir -p docs
          pdoc pr2 tests -o docs
          git add docs
          git push 
        # echo "Project Documentation" > docs/index.md
        # echo "Last updated on $(date)" >> docs/index.md

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/

  dev-to-master:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          base: development
          title: "dev <- master (auto-merge)"
          body: |
            Авто-PR из `development` в `master`.
          commit-message: "chore: merge dev to master"

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
