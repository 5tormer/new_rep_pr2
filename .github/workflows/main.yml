name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - development
      - release
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install sphinx

      - name: Run unit tests
        run: python -m pytest tests/test.py -v

      - name: Generate documentation
        run: |
          mkdir -p docs
          echo "Project Documentation" > docs/index.md
          echo "Last updated on $(date)" >> docs/index.md

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/

  create-and-automerge-pr:
      needs: build-and-test
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/development' && github.event_name == 'push'
      permissions:
        contents: write
        pull-requests: write
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Create Pull Request
          id: cpr
          uses: peter-evans/create-pull-request@v6
          with:
            token: ${{ secrets.GITHUB_TOKEN }}
            branch: development
            base: master
            title: "development → Master: Auto-merge after tests"
            body: |
              Автоматический релиз из ветки `development` в `master`.

              Все тесты пройдены.
              Документация сгенерирована.
              Дата: $(date +'%Y-%m-%d %H:%M')

              Этот PR будет **автоматически слит** после успешных проверок.
            draft: false
            delete-branch: false

        - name: Enable auto-merge for PR
          if: steps.cpr.outputs.pull-request-number != ''
          run: |
            gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --squash
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
